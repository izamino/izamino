<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>سامانه حضور خادم‌الشهدا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap">
<style>
/* Layout: right-hand rail of sections (RTL), working pane on the left; paper documents (letters, reports) sit on a fixed white sheet in both themes. */
:root{
  --bg:#e9ece5; --surface:#f8f9f5; --surface-2:#eef1ea; --ink:#18231d; --muted:#58665d; --line:#d0d6cb;
  --accent:#1d5640; --accent-soft:#d6e6dc; --accent-ink:#ffffff;
  --seal:#7f2a26;
  --ok:#23704a; --ok-soft:#d5ecdd; --bad:#a8322b; --bad-soft:#f5dcd8; --warn:#93600f; --warn-soft:#f4e6c9;
  --paper:#ffffff; --paper-ink:#1a1a1a; --paper-line:#7f2a26; --paper-muted:#555555;
  --f-body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-display:"Noto Nastaliq Urdu","Vazirmatn",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18201c; --surface-2:#1f2924; --ink:#e3e9e2; --muted:#98a59c; --line:#2d3832;
  --accent:#62b58c; --accent-soft:#1f3a2d; --accent-ink:#0b1711;
  --seal:#da7a70;
  --ok:#6cc690; --ok-soft:#1d3a29; --bad:#ef7d72; --bad-soft:#40211e; --warn:#e2aa52; --warn-soft:#3b2e17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201c; --surface-2:#1f2924; --ink:#e3e9e2; --muted:#98a59c; --line:#2d3832;
  --accent:#62b58c; --accent-soft:#1f3a2d; --accent-ink:#0b1711;
  --seal:#da7a70;
  --ok:#6cc690; --ok-soft:#1d3a29; --bad:#ef7d72; --bad-soft:#40211e; --warn:#e2aa52; --warn-soft:#3b2e17;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.4}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:18px}
.login-head{display:grid;justify-items:center;gap:4px;text-align:center}
.login-head .logo{width:72px;height:72px;color:var(--seal)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:2.2;color:var(--seal)}
.brand-sub{color:var(--muted);font-size:13px}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.field textarea{min-height:180px;line-height:2;resize:vertical}
.demo{border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--muted);display:grid;gap:6px}
.demo-list{display:flex;flex-wrap:wrap;gap:6px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.logo-slot{display:contents}
img.logo{object-fit:contain}
.login-title{font-size:14px;font-weight:700;margin:0}
.join{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.join b{color:var(--accent)}
.join p{margin:0;font-size:13px;color:var(--ink)}
.join .btn{justify-content:center;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done{display:grid;justify-items:center;text-align:center;gap:8px;padding-block:8px}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done .tick svg{width:30px;height:30px}
.done h4{margin:0;font-size:17px}
.done p{margin:0;color:var(--muted)}
.code{font-size:20px;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--accent)}
.nav-badge{margin-inline-start:auto;background:var(--bad);color:var(--paper);border-radius:999px;font-size:11.5px;padding:0 7px;line-height:1.7}
.logo-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box .prev{width:84px;height:84px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--seal);background:var(--bg)}
.logo-box .prev .logo{width:70px;height:70px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-left:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.rail-brand{display:flex;gap:10px;align-items:center}
.rail-brand .logo{width:42px;height:42px;flex:none;color:var(--seal)}
.rail-brand .t{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:2.1;color:var(--seal)}
.rail-brand .s{font-size:11.5px;color:var(--muted)}
nav{display:grid;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a svg{width:18px;height:18px;flex:none;color:var(--muted)}
nav a:hover{background:var(--surface-2)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a[aria-current="page"] svg{color:var(--accent-ink)}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px;font-size:13px}
.me b{font-size:14px}
main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:grid;gap:18px;align-content:start}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.page-head h1{font-size:22px;font-weight:800}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.sample-note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn svg{width:16px;height:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search],.toolbar input[type=text],.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.active,.pill.p{background:var(--ok-soft);color:var(--ok)}
.pill.normal,.pill.e{background:var(--warn-soft);color:var(--warn)}
.pill.inactive,.pill.a{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.pill.draft{background:var(--surface-2);color:var(--muted)}
.pill.sent{background:var(--accent-soft);color:var(--accent)}
.pill.seen{background:var(--ok-soft);color:var(--ok)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.called{background:var(--warn-soft);color:var(--warn)}
.pill.accepted{background:var(--ok-soft);color:var(--ok)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.type{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 7px}

/* ---------- panels, tables ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel > h2{font-size:15px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-body{padding:14px 16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.actions{white-space:nowrap;text-align:left}
td.num{white-space:nowrap}
td.actions .btn{margin-inline-start:4px}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.lg{width:72px;height:72px;font-size:24px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .h{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;min-width:90px}
.bar i{display:block;height:100%}
.bar .p{background:var(--ok)} .bar .e{background:var(--warn)} .bar .a{background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:5px;background:var(--c)}

/* ---------- attendance sheet ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-size:13.5px;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"].p{background:var(--ok);color:var(--paper)}
.seg button[aria-pressed="true"].a{background:var(--bad);color:var(--paper)}
.seg button[aria-pressed="true"].e{background:var(--warn);color:var(--paper)}
.prog-head{display:grid;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13.5px}
.meta b{color:var(--ink);font-weight:500}

/* ---------- profile ---------- */
.profile{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile h2{font-size:21px;font-weight:800}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 18px}
.info div{display:grid}
.info dt{font-size:12px;color:var(--muted)}
.info dd{margin:0;font-weight:500}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgb(10 16 13 / .55);display:grid;place-items:center;z-index:50;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{max-width:900px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.modal header h3{font-size:16px}
.modal .mbody{padding:16px;overflow:auto;display:grid;gap:12px}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal footer .hint{margin-inline-end:auto;font-size:12.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgb(0 0 0 / .2)}

/* ---------- paper (letters & printable reports) ---------- */
.paper-wrap{overflow-x:auto;background:var(--surface-2);border-radius:8px;padding:16px}
.paper{width:794px;min-height:1080px;margin:0 auto;background:var(--paper);color:var(--paper-ink);padding:40px 48px 36px;font-size:14px;line-height:2;display:flex;flex-direction:column;box-shadow:0 2px 14px rgb(0 0 0 / .12)}
.lh{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px}
.lh-id{display:flex;gap:12px;align-items:center}
.lh-id .logo{width:74px;height:74px;flex:none;color:var(--paper-line)}
.lh-name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:2.2;color:var(--paper-line)}
.lh-sub{font-family:var(--f-display);font-size:13.5px;line-height:2.2;color:var(--paper-ink)}
.lh-bism{font-family:var(--f-display);font-size:15px;text-align:center;padding-top:4px}
.lh-meta{justify-self:end;font-size:13px;display:grid;gap:0;min-width:170px}
.lh-meta div{display:flex;gap:6px;border-bottom:1px dotted var(--paper-muted)}
.lh-meta span{color:var(--paper-muted);min-width:44px}
.lh-rule{border:0;border-top:2.5px solid var(--paper-line);margin:14px 0 2px}
.lh-rule2{border:0;border-top:.8px solid var(--paper-line);margin:0 0 22px}
.letter-to{font-weight:700}
.letter-subj{margin:6px 0 14px}
.letter-subj b{font-weight:700}
.letter-body{white-space:pre-wrap;text-align:justify;flex:1}
.sign{margin-top:28px;display:flex;justify-content:flex-end}
.sign div{text-align:center;min-width:220px}
.sign .n{font-weight:700}
.order{margin-top:18px;border:1px solid var(--paper-line);padding:10px 14px;border-radius:4px}
.order h4{margin:0 0 4px;color:var(--paper-line);font-size:13px}
.paper-foot{margin-top:24px;border-top:.8px solid var(--paper-line);padding-top:6px;font-size:11.5px;color:var(--paper-muted);display:flex;justify-content:space-between;gap:12px}
.paper h3.doc-title{text-align:center;font-size:17px;margin-bottom:12px}
.paper table{font-size:13px}
.paper th{background:#f1ece4;color:var(--paper-ink)}
.paper th,.paper td{border:1px solid #c9c2b8;padding:5px 9px}
.paper tbody tr:hover td{background:transparent}
.paper .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px;margin-bottom:14px;font-size:13.5px}
.paper .kv span{color:var(--paper-muted)}
.paper .sum{display:flex;gap:22px;margin:10px 0 14px;font-size:13.5px;flex-wrap:wrap}
.paper .signs{display:flex;justify-content:space-between;margin-top:36px;text-align:center}
.paper .st-p{color:#1f6b42;font-weight:700} .paper .st-a{color:#a8322b;font-weight:700} .paper .st-e{color:#8a5a0e;font-weight:700}

#print-area{display:none}

@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-left:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  nav{display:flex;overflow-x:auto;gap:4px}
  nav a{white-space:nowrap;padding:6px 10px}
  .me{margin:0;border:0;padding:0;display:flex;align-items:center;justify-content:space-between;position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px))}
  .me .who-txt{display:none}
  main{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body > *:not(#print-area){display:none !important}
  #print-area{display:block}
  #print-area .paper{box-shadow:none;width:210mm;min-height:297mm;margin:0;padding:14mm 16mm}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,nav a{transition:background .15s,border-color .15s}}
</style>

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = v => String(v ?? '').replace(/[0-9]/g, d => FA[d]);
const en = v => String(v ?? '').replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function todayJ(){
  try{
    const parts = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const g = t => (parts.find(p => p.type === t) || {}).value || '';
    return `${g('year').replace(/\D/g,'')}/${g('month')}/${g('day')}`;
  }catch(e){ return '1405/08/14'; }
}
function normDate(s){
  const m = en(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3];
  if(y<1300||y>1500||mo<1||mo>12||d<1||d>31||(mo>6&&d>30)) return null;
  return `${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}
function fmtDate(s){
  if(!s) return '—';
  const [y,m,d] = s.split('/');
  return `${fa(+d)} ${MONTHS[+m-1]||''} ${fa(y)}`;
}
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const initials = m => (m.first||' ')[0] + '‌' + (m.last||' ')[0];
const fullName = m => `${m.first} ${m.last}`;
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
const logoHTML = () => db.settings.logo ? `<img class="logo" src="${db.settings.logo}" alt="">` : '<svg class="logo" aria-hidden="true"><use href="#emblem"/></svg>';
const icon = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const inFrame = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();

/* ================= data ================= */
const DB_KEY = 'basij-hozour-v1';
const STATUS = {active:'فعال', normal:'عادی', inactive:'غیرفعال'};
const ATT = {p:'حاضر', a:'غایب', e:'موجه'};
const TYPES = ['رزمایش','صبحگاه','جلسه','اردو','مراسم','آموزش','کار جهادی','سایر'];
const ROLES = {
  admin:     {label:'مدیر سامانه',     can:['members','programs','attendance','letters','users','setup']},
  commander: {label:'فرمانده پایگاه',  can:['members','programs','attendance','letters','review']},
  hr:        {label:'نیروی انسانی',    can:['members','programs','attendance','letters']},
  cyber:     {label:'فضای مجازی',      can:['programs','attendance']},
};
const LSTAT = {draft:'پیش‌نویس', sent:'ارسال به فرماندهی', seen:'رؤیت فرمانده'};

function seed(){
  const names = [['محمدحسین','رضایی','علی'],['علی','کریمی','حسن'],['مهدی','احمدی','رضا'],['امیرحسین','موسوی','سیدمحمد'],['سجاد','نوری','قاسم'],['حسین','صادقی','محمود'],['رضا','جعفری','اکبر'],['محمدرضا','قاسمی','عباس'],['ابوالفضل','حیدری','مجید'],['مصطفی','رحیمی','ناصر'],['یاسین','کاظمی','جواد'],['محمدامین','باقری','حمید']];
  const st = ['active','active','active','normal','active','normal','active','inactive','active','normal','active','normal'];
  const groups = ['جوان','جوان','بزرگسال','نوجوان','جوان','بزرگسال','جوان','بزرگسال','نوجوان','جوان','نوجوان','جوان'];
  const members = names.map((n,i)=>({
    id:'m'+(i+1), first:n[0], last:n[1], father:n[2],
    nationalId:'000'+String(1234560+i*37).padStart(7,'0'), shenasname:String(1200+i*317), birth:`${1370+(i*3)%17}/${String(1+i%12).padStart(2,'0')}/${String(5+i*2%23).padStart(2,'0')}`,
    phone:'0912000'+String(1000+i*113).slice(0,4), memberNo:'۱۴۰'+(i%5)+'-'+(101+i), status:st[i], group:groups[i],
    joinDate:`${1398+i%6}/0${1+i%9}/1${i%9}`, education:['دیپلم','کارشناسی','دانش‌آموز','کاردانی','کارشناسی ارشد'][i%5],
    address:'محله شباب، کوچه شهید '+['همت','باکری','خرازی','کاظمی'][i%4], notes:''
  }));
  const programs = [
    {id:'p1', title:'صبحگاه مشترک پایگاه', type:'صبحگاه', date:'1405/07/15', time:'06:30', place:'حیاط مسجد شباب اهل جنت', desc:''},
    {id:'p2', title:'رزمایش اقتدار عاشورایی', type:'رزمایش', date:'1405/07/29', time:'08:00', place:'پارک محله', desc:'رزمایش منطقه‌ای با حضور گردان‌های محلات'},
    {id:'p3', title:'اردوی جهادی روستای کلاته', type:'کار جهادی', date:'1405/08/01', time:'07:00', place:'روستای کلاته', desc:'سه روزه؛ تعمیر مدرسه روستا'},
    {id:'p4', title:'جلسه هفتگی حلقه صالحین', type:'جلسه', date:'1405/08/06', time:'19:30', place:'کتابخانه مسجد', desc:''},
    {id:'p5', title:'غبارروبی گلزار شهدا', type:'مراسم', date:'1405/08/10', time:'16:00', place:'گلزار شهدای شهر', desc:''},
    {id:'p6', title:'رزمایش پدافند غیرعامل', type:'رزمایش', date:'1405/08/20', time:'08:00', place:'حیاط مسجد', desc:'برنامه آینده'},
  ];
  const attendance = {};
  const pattern = {p1:'ppapppaepppa', p2:'pppepppapppe', p3:'ppappeppaapp', p4:'pppppaapppep', p5:'pepppaappppa'};
  for(const [pid, pat] of Object.entries(pattern)){
    attendance[pid] = {};
    members.forEach((m,i)=>{ if(m.status==='inactive' && pat[i]!=='p') return; attendance[pid][m.id] = pat[i]; });
  }
  return {
    sample:true,
    settings:{ baseName:'پایگاه مقاومت بسیج خادم‌الشهدا حاج احمد یلالی', subtitle:'مسجد شباب اهل جنت', address:'', phone:'', letterSeq:3, logo:'' },
    requests:[
      {id:'r1', code:'۴۷۲۱۰۵', date:'1405/08/12', first:'امیرعلی', last:'نظری', father:'محسن', nationalId:'0013542871', shenasname:'۲۴۵۱', birth:'1388/04/02', phone:'09120004417', education:'دانش‌آموز', address:'محله شباب، کوچه شهید چمران', notes:'علاقه‌مند به فعالیت در گروه فرهنگی', status:'new'},
      {id:'r2', code:'۴۷۲۰۹۸', date:'1405/08/09', first:'سیدمهدی', last:'حسینی', father:'سیدجواد', nationalId:'0021874593', shenasname:'۱۱۸۷۳', birth:'1381/11/20', phone:'09350006652', education:'کارشناسی', address:'خیابان شهید بهشتی', notes:'', status:'called'},
    ],
    users:[
      {id:'u1', username:'admin',     password:'admin123', name:'مدیر سامانه',          role:'admin'},
      {id:'u2', username:'farmandeh', password:'1234',     name:'فرمانده پایگاه',        role:'commander'},
      {id:'u3', username:'niroo',     password:'1234',     name:'مسئول نیروی انسانی',    role:'hr'},
      {id:'u4', username:'majazi',    password:'1234',     name:'مسئول فضای مجازی',      role:'cyber'},
    ],
    members, programs, attendance,
    letters:[
      {id:'l1', no:'1405/1', date:'1405/07/30', to:'فرمانده محترم پایگاه', subject:'گزارش برگزاری رزمایش اقتدار عاشورایی', attach:'فهرست حاضرین', body:'سلام علیکم\nبا احترام، به استحضار می‌رساند رزمایش اقتدار عاشورایی در تاریخ ۲۹ مهرماه با حضور ۹ نفر از نیروهای پایگاه برگزار شد. فهرست حاضرین پیوست است.\nخواهشمند است دستور فرمایید از نیروهای فعال تقدیر شود.', signer:'مسئول نیروی انسانی', by:'u3', status:'seen', order:'اقدام شود؛ لوح تقدیر برای نفرات حاضر تهیه گردد.'},
      {id:'l2', no:'1405/2', date:'1405/08/11', to:'فرمانده محترم پایگاه', subject:'درخواست تجهیزات اردوی جهادی', attach:'ندارد', body:'سلام علیکم\nاحتراماً جهت برگزاری اردوی جهادی آتی، تأمین وسایل زیر درخواست می‌شود:\n۱. ده عدد بیل و کلنگ\n۲. رنگ و قلم‌مو برای بازسازی مدرسه\n۳. هماهنگی وسیله نقلیه\nخواهشمند است دستور مقتضی صادر فرمایید.', signer:'مسئول نیروی انسانی', by:'u3', status:'sent', order:''},
    ],
  };
}
let db;
function load(){
  try{ const s = localStorage.getItem(DB_KEY); if(s){ db = JSON.parse(s); } }catch(e){}
  if(!db) db = seed();
  db.requests = db.requests || []; if(db.settings.logo === undefined) db.settings.logo = '';
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }

let me = null;
function restoreSession(){
  try{ const id = sessionStorage.getItem('basij-hozour-user'); me = db.users.find(u => u.id === id) || null; }catch(e){ me = null; }
}
const newReqs = () => db.requests.filter(r => r.status==='new').length;
const can = p => !!me && ROLES[me.role].can.includes(p);

/* ---------- stats ---------- */
const memberById = id => db.members.find(m => m.id === id);
const progById = id => db.programs.find(p => p.id === id);
function memberStats(mid, programs = db.programs){
  const s = {p:0,a:0,e:0,total:0, rows:[]};
  for(const p of programs){
    const v = (db.attendance[p.id]||{})[mid];
    if(!v) continue;
    s[v]++; s.total++; s.rows.push({p, v});
  }
  s.rows.sort((x,y)=> x.p.date < y.p.date ? 1 : -1);
  return s;
}
function progStats(pid){
  const r = db.attendance[pid] || {}; const s = {p:0,a:0,e:0,total:0};
  for(const v of Object.values(r)){ if(s[v]!==undefined){ s[v]++; s.total++; } }
  return s;
}
const barHTML = s => s.total ? `<div class="bar" title="حاضر ${fa(s.p)} · موجه ${fa(s.e)} · غایب ${fa(s.a)}"><i class="p" style="width:${s.p*100/s.total}%"></i><i class="e" style="width:${s.e*100/s.total}%"></i><i class="a" style="width:${s.a*100/s.total}%"></i></div>` : '<span class="pill none">ثبت نشده</span>';

/* ================= routing & shell ================= */
const VIEWS = [
  {id:'dashboard', label:'پیشخوان',          icon:'i-home'},
  {id:'members',   label:'نیروی انسانی',      icon:'i-users'},
  {id:'programs',  label:'برنامه‌ها و حضور',   icon:'i-cal'},
  {id:'reports',   label:'گزارش‌ها',           icon:'i-chart'},
  {id:'requests',  label:'درخواست‌های عضویت', icon:'i-inbox', need:'members'},
  {id:'letters',   label:'گزارش به فرماندهی', icon:'i-mail'},
  {id:'accounts',  label:'کاربران سامانه',    icon:'i-key',  need:'users'},
  {id:'base-info', label:'مشخصات پایگاه',     icon:'i-flag', need:'setup'},
];
let state = { view:'dashboard', member:null, program:null, mFilter:'all', mSearch:'', sheetSearch:'', showInactive:false, rFrom:'', rTo:'', rType:'' };

function route(){
  const h = location.hash.slice(1);
  const v = VIEWS.find(x => x.id === h && (!x.need || can(x.need)));
  state.view = v ? v.id : 'dashboard';
  state.member = null; state.program = null;
  render();
}
function go(view){ if(location.hash.slice(1) === view){ route(); } else { location.hash = view; } }

function bindBrand(){
  document.querySelectorAll('[data-bind]').forEach(el => { el.textContent = db.settings[el.dataset.bind] || ''; });
  document.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = logoHTML(); });
}
function showLogin(){
  $('#app').hidden = true; $('#login').hidden = false;
  bindBrand();
  $('#demo-list').innerHTML = db.users.slice(0,4).map(u => `<button type="button" class="chip" data-act="fill" data-id="${u.id}">${esc(ROLES[u.role].label)} · <span dir="ltr">${esc(u.username)}</span></button>`).join('');
}
function render(){
  if(!me){ showLogin(); return; }
  $('#login').hidden = true; $('#app').hidden = false;
  bindBrand();
  $('#me-name').textContent = me.name; $('#me-role').textContent = ROLES[me.role].label;
  $('#nav').innerHTML = VIEWS.filter(v => !v.need || can(v.need)).map(v =>
    `<a href="#${v.id}" ${v.id===state.view?'aria-current="page"':''}>${icon(v.icon)}<span>${v.label}</span>${v.id==='requests'&&newReqs()?`<span class="nav-badge num">${fa(newReqs())}</span>`:''}</a>`).join('');
  const main = $('#main');
  let html = '';
  if(state.member) html = viewMember();
  else if(state.program) html = viewSheet();
  else html = ({dashboard:viewDashboard, members:viewMembers, requests:viewRequests, programs:viewPrograms, reports:viewReports, letters:viewLetters, accounts:viewAccounts, 'base-info':viewBaseInfo}[state.view])();
  const note = db.sample ? `<div class="sample-note">اطلاعات فعلی نمونه است تا کار سامانه دیده شود.${can('setup') ? ' <button class="btn sm" data-act="clear-sample">پاک کردن نمونه‌ها و شروع کار واقعی</button>' : ''}</div>` : '';
  main.innerHTML = note + html;
}

/* ================= views ================= */
function viewDashboard(){
  const ms = db.members, cnt = k => ms.filter(m => m.status===k).length;
  const today = todayJ();
  const past = db.programs.filter(p => p.date <= today).sort((a,b)=> a.date<b.date?1:-1);
  const upcoming = db.programs.filter(p => p.date > today).sort((a,b)=> a.date>b.date?1:-1);
  let P=0,T=0; past.forEach(p=>{ const s=progStats(p.id); P+=s.p; T+=s.total; });
  const ranked = ms.map(m => ({m, s:memberStats(m.id)})).filter(x=>x.s.total).sort((a,b)=> b.s.p - a.s.p || pct(b.s.p,b.s.total)-pct(a.s.p,a.s.total)).slice(0,6);
  const pending = db.letters.filter(l => l.status==='sent');
  return `
  <div class="page-head"><div><h1>پیشخوان</h1><p>امروز ${fmtDate(today)} · خوش آمدید ${esc(me.name)}</p></div>
    <div class="toolbar">${can('attendance') && past[0] ? `<button class="btn primary" data-act="open-sheet" data-id="${past[0].id}">${icon('i-cal')}حضور و غیاب آخرین برنامه</button>`:''}</div></div>
  <div class="stats">
    <div class="stat"><span class="k">کل نیروها</span><span class="v">${fa(ms.length)}</span><span class="h">${fa(cnt('active'))} فعال · ${fa(cnt('normal'))} عادی · ${fa(cnt('inactive'))} غیرفعال</span></div>
    <div class="stat"><span class="k">برنامه‌های برگزارشده</span><span class="v">${fa(past.length)}</span><span class="h">${fa(upcoming.length)} برنامه پیش رو</span></div>
    <div class="stat"><span class="k">میانگین حضور</span><span class="v">${fa(pct(P,T))}٪</span><span class="h">${fa(P)} حضور از ${fa(T)} ثبت</span></div>
    ${can('members')?`<div class="stat"><span class="k">درخواست عضویت جدید</span><span class="v">${fa(newReqs())}</span><span class="h">${fa(db.requests.length)} درخواست در کل · <a href="#requests" style="color:var(--accent)">بررسی</a></span></div>`:''}
    <div class="stat"><span class="k">نامه‌های منتظر فرمانده</span><span class="v">${fa(pending.length)}</span><span class="h">${pending.length?'در انتظار رؤیت':'همه رؤیت شده'}</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><h2>آخرین برنامه‌ها <span class="legend"><span style="--c:var(--ok)">حاضر</span><span style="--c:var(--warn)">موجه</span><span style="--c:var(--bad)">غایب</span></span></h2>
      <div class="scroll"><table><thead><tr><th>تاریخ</th><th>برنامه</th><th>حضور</th><th style="width:30%">ترکیب</th></tr></thead><tbody>
      ${[...upcoming.slice(0,2).reverse(), ...past.slice(0,5)].map(p => { const s=progStats(p.id); return `<tr><td class="num">${fmtDate(p.date)}</td><td><button class="btn link" data-act="open-sheet" data-id="${p.id}">${esc(p.title)}</button> <span class="type">${esc(p.type)}</span></td><td class="num">${p.date>today?'<span class="pill sent">پیش رو</span>':fa(s.p)+' نفر'}</td><td>${p.date>today?'':barHTML(s)}</td></tr>`; }).join('')}
      </tbody></table></div></section>

function validNid(s){
  if(!/^\d{10}$/.test(s) || /^(\d)\1{9}$/.test(s)) return false;
  let sum = 0; for(let i=0;i<9;i++) sum += +s[i]*(10-i);
  const r = sum % 11, c = +s[9];
  return r < 2 ? c === r : c === 11 - r;
}

    <p>کد پیگیری</p><div class="code">${esc(code)}</div></div>`,
    foot:'<button type="button" class="btn primary" data-act="close">متوجه شدم</button>'});
}
function readLogo(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast('یک فایل تصویری انتخاب کنید'); return; }
  const fr = new FileReader();
  fr.onload = () => { const img = new Image();
    img.onload = () => { const w = img.naturalWidth || 320, h = img.naturalHeight || 320, k = Math.min(1, 360/Math.max(w,h));
      const c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      db.settings.logo = c.toDataURL('image/png'); save(); render(); toast('لوگوی پایگاه ثبت شد'); };
    img.onerror = () => toast('این تصویر خوانده نشد؛ فایل دیگری امتحان کنید');
    img.src = fr.result; };
  fr.readAsDataURL(file);
}

  join(){ joinForm(); },

  'req-called'(id){ const r = db.requests.find(x=>x.id===id); r.status='called'; save(); render(); toast('تماس ثبت شد'); },
  'req-reject'(id){ const r = db.requests.find(x=>x.id===id); r.status='rejected'; save(); render(); toast('درخواست رد شد'); },
  'req-accept'(id){ const r = db.requests.find(x=>x.id===id);
    if(db.members.some(m=>m.nationalId===r.nationalId)){ toast('این کد ملی در فهرست نیروها هست'); return; }
    const m = {id:uid('m'), first:r.first, last:r.last, father:r.father, nationalId:r.nationalId, shenasname:r.shenasname, birth:r.birth, phone:r.phone, memberNo:'', status:'normal', group:'جوان', joinDate:todayJ(), education:r.education, address:r.address, notes:r.notes};
    db.members.push(m); r.status='accepted'; r.memberId=m.id; save(); render(); toast(fullName(m)+' به فهرست نیروها اضافه شد'); },
  'req-del'(id){ const r = db.requests.find(x=>x.id===id); confirmBox(`درخواست <b>${esc(r.first+' '+r.last)}</b> حذف شود؟`, ()=>{ db.requests = db.requests.filter(x=>x!==r); save(); render(); toast('حذف شد'); }); },
  'logo-remove'(){ db.settings.logo=''; save(); render(); toast('نشان پیش‌فرض برگشت'); },
  fill(id){ const u = db.users.find(x=>x.id===id); $('#lg-user').value = u.username; $('#lg-pass').value = u.password; },
  logout(){ me = null; try{ sessionStorage.removeItem('basij-hozour-user'); }catch(e){} render(); },
  close: closeModal,
  overlay(_, el, e){ if(e.target === el) closeModal(); },
  back(id){ state.member=null; state.program=null; go(id); },
  'open-member'(id){ state.member=id; state.program=null; render(); window.scrollTo(0,0); },
  'open-sheet'(id){ state.program=id; state.member=null; state.sheetSearch=''; render(); window.scrollTo(0,0); },
  'm-filter'(id){ state.mFilter=id; render(); },
  'member-new'(){ memberForm(); },
  'member-edit'(id){ memberForm(memberById(id)); },
  'member-del'(id){ const m = memberById(id); confirmBox(`پرونده <b>${esc(fullName(m))}</b> و همه سوابق حضورش حذف شود؟`, ()=>{ db.members = db.members.filter(x=>x!==m); for(const r of Object.values(db.attendance)) delete r[id]; if(state.member===id) state.member=null; save(); render(); toast('حذف شد'); }); },
  'prog-new'(){ programForm(); },
  'prog-edit'(id){ programForm(progById(id)); },
  'prog-del'(id){ const p = progById(id); confirmBox(`برنامه <b>${esc(p.title)}</b> و حضور و غیاب آن حذف شود؟`, ()=>{ db.programs = db.programs.filter(x=>x!==p); delete db.attendance[id]; save(); render(); toast('حذف شد'); }); },
  mark(id, el){ const pid = state.program; const r = db.attendance[pid] = db.attendance[pid] || {}; const v = el.dataset.v; if(r[id]===v) delete r[id]; else r[id]=v; save(); render(); },
  'all-present'(pid){ const r = db.attendance[pid] = db.attendance[pid]||{}; sheetMembers(progById(pid)).forEach(m=>{ r[m.id]='p'; }); save(); render(); toast('همه حاضر ثبت شدند'); },
  'rest-absent'(pid){ const r = db.attendance[pid] = db.attendance[pid]||{}; sheetMembers(progById(pid)).forEach(m=>{ if(!r[m.id]) r[m.id]='a'; }); save(); render(); toast('ثبت‌نشده‌ها غایب شدند'); },
  'apply-report'(){
    const f = $('#r-from').value.trim(), t = $('#r-to').value.trim();
    const nf = f ? normDate(f) : '', nt = t ? normDate(t) : '';
    if(nf===null || nt===null){ toast('تاریخ را به شکل ۱۴۰۵/۰۷/۰۱ وارد کنید'); return; }
    state.rFrom = nf; state.rTo = nt; state.rType = $('#r-type').value; render();
  },
  'print-member'(id, el){ const m = memberById(id); showPaper('کارنامه حضور '+esc(fullName(m)), memberPaper(m, el.dataset.range ? filteredPrograms() : db.programs)); },
  'print-program'(id){ const p = progById(id); showPaper('صورت‌جلسه حضور '+esc(p.title), programPaper(p)); },
  'print-summary'(){ showPaper('گزارش جمعی حضور', summaryPaper()); },
  'do-print'(){ try{ window.print(); }catch(e){} },
  'letter-new'(){ letterForm(); },
  'letter-edit'(id){ letterForm(db.letters.find(l=>l.id===id)); },
  'letter-view'(id){ const l = db.letters.find(x=>x.id===id); showPaper(esc(l.subject), letterPaper(l)); },
  'letter-del'(id){ const l = db.letters.find(x=>x.id===id); confirmBox(`نامه «${esc(l.subject)}» حذف شود؟`, ()=>{ db.letters = db.letters.filter(x=>x!==l); save(); render(); toast('حذف شد'); }); },
  'letter-review'(id){ const l = db.letters.find(x=>x.id===id);
    modal({title:'رؤیت نامه و ثبت دستور', wide:true, body:`<div class="paper-wrap">${letterPaper(l)}</div>${fld('o-text','دستور یا پی‌نوشت فرمانده',l.order,{area:1})}`,
      foot:'<button type="button" class="btn" data-act="close">انصراف</button><button class="btn primary" type="submit">ثبت رؤیت</button>',
      onSubmit:()=>{ l.order = $('#o-text').value.trim(); l.status='seen'; save(); render(); toast('رؤیت ثبت شد'); }}); },
  'user-new'(){ userForm(); },
  'user-edit'(id){ userForm(db.users.find(u=>u.id===id)); },
  'user-del'(id){ const u = db.users.find(x=>x.id===id); confirmBox(`کاربر <b>${esc(u.name)}</b> حذف شود؟`, ()=>{ db.users = db.users.filter(x=>x!==u); save(); render(); toast('حذف شد'); }); },
  'preview-lh'(){ showPaper('پیش‌نمایش سربرگ', letterPaper({no:todayJ().slice(0,4)+'/…', date:todayJ(), attach:'ندارد', to:'فرمانده محترم پایگاه', subject:'نمونه', body:'متن نامه در این قسمت نوشته می‌شود.', signer:me.name, status:'draft'})); },
  'clear-sample'(){ confirmBox('همه نیروها، برنامه‌ها، نامه‌ها و درخواست‌های نمونه پاک شوند؟ کاربران و مشخصات پایگاه می‌مانند.', ()=>{ db.members=[]; db.programs=[]; db.attendance={}; db.letters=[]; db.requests=[]; db.sample=false; db.settings.letterSeq=1; save(); render(); toast('آماده ورود اطلاعات واقعی'); }); },
  'reset-all'(){ confirmBox('همه داده‌ها پاک و نمونه‌ها برگردانده شوند؟', ()=>{ db = seed(); save(); me = db.users.find(u=>u.username===me.username) || db.users[0]; render(); toast('نمونه‌ها برگشت'); }); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.dataset.act==='overlay'){ fn(null, el, e); return; }
  if(el.tagName==='A') e.preventDefault();
  fn(el.dataset.id, el, e);
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#modal-root').innerHTML) closeModal(); });
document.addEventListener('input', e => {
  if(e.target.id==='m-search'){ state.mSearch = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#m-search'); i.focus(); i.setSelectionRange(pos,pos); }
  if(e.target.id==='sheet-search'){ state.sheetSearch = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#sheet-search'); i.focus(); i.setSelectionRange(pos,pos); }
});
document.addEventListener('change', e => { if(e.target.id==='show-inactive'){ state.showInactive = e.target.checked; render(); } if(e.target.id==='s-logo'){ readLogo(e.target.files[0]); } });
document.addEventListener('submit', e => {
  if(e.target.id==='login-form'){
    e.preventDefault();
    const u = db.users.find(x => x.username === $('#lg-user').value.trim() && x.password === $('#lg-pass').value);
    if(!u){ $('#lg-err').textContent = 'شناسه یا رمز عبور درست نیست.'; return; }
    me = u; $('#lg-err').textContent = ''; try{ sessionStorage.setItem('basij-hozour-user', u.id); }catch(err){}
    route();
  }
  if(e.target.id==='base-form'){
    e.preventDefault();
    Object.assign(db.settings, {baseName:val('s-name'), subtitle:val('s-sub'), address:val('s-addr'), phone:val('s-phone')});
    save(); render(); toast('مشخصات پایگاه ذخیره شد');
  }
});
window.addEventListener('hashchange', route);

load(); restoreSession();
/* Preview convenience: inside the preview frame, open straight into the admin desk so the system is visible at once. */
if(!me && db.sample && inFrame){ me = db.users.find(u => u.role==='admin'); }
route();
})();
