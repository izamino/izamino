<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s3-rituals-template">
      <style>
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Light.woff2") format("woff2"); font-weight: 300; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Bold.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Black.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-ExtraBlack.woff2") format("woff2"); font-weight: 950; }
        #s3 {
          position: absolute;
          inset: 0;
          direction: rtl;
          font-family: "Abar", sans-serif;
          color: #f4ecdd;
        }
        #s3-label {
          position: absolute;
          top: 300px;
          left: 0;
          right: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          font-size: 30px;
          font-weight: 500;
          color: #1fb5a8;
        }
        #s3-label .rule {
          display: block;
          width: 120px;
          height: 2px;
          background: #c9a24a;
        }
        .s3-beat {
          position: absolute;
          left: 0;
          right: 0;
          top: 760px;
          height: 400px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s3-word {
          display: block;
          font-family: "Abar", sans-serif;
          font-weight: 900;
          font-size: 150px;
          line-height: 1;
          color: #f4ecdd;
        }
        #s3-together {
          position: absolute;
          left: 0;
          right: 0;
          top: 700px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        }
        #s3-together .w {
          display: block;
          font-family: "Abar", sans-serif;
          font-weight: 900;
          font-size: 130px;
          line-height: 1.02;
          color: #e6c574;
        }
        #s3-together .w.mid {
          color: #f4ecdd;
          font-size: 70px;
        }
      </style>
      <div id="s3" data-composition-id="s3-rituals" data-width="1080" data-height="1920" data-duration="6">
        <div id="s3-label"><span id="s3-label-t">مراسم مذهبی، فرهنگی و مناسبتی</span><span class="rule" id="s3-label-r"></span></div>

        <div class="s3-beat" id="s3-b1"><span class="s3-word">نماز</span></div>
        <div class="s3-beat" id="s3-b2"><span class="s3-word">عزاداری</span></div>
        <div class="s3-beat" id="s3-b3"><span class="s3-word">جشن</span></div>


        <div id="s3-together">
          <span class="w" id="s3-t1">همه</span>
          <span class="w mid" id="s3-t2">با</span>
          <span class="w" id="s3-t3">هم</span>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s3-label-t", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo("#s3-label-r", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.15);

          // Beat 1 — نماز: scale slam with blur, prayer rows rise beneath
          tl.fromTo("#s3-b1", { scale: 2.4, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.0);
          tl.to("#s3-b1", { x: 300, opacity: 0, duration: 0.25, ease: "power2.in" }, 1.25);

          // Beat 2 — عزاداری: side snap from the right
          tl.fromTo("#s3-b2", { x: 700, opacity: 0, skewX: -12 }, { x: 0, opacity: 1, skewX: 0, duration: 0.42, ease: "power4.out" }, 1.4);
          tl.to("#s3-b2", { y: -160, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.45);

          // Beat 3 — جشن: rise + rotate, golden sparks pop around it
          tl.fromTo("#s3-b3", { y: 260, rotation: -10, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 2.6);
          tl.to("#s3-b3", { scale: 0.6, opacity: 0, duration: 0.25, ease: "power2.in" }, 3.6);

          // Payoff — همه با هم (stacked slam, impact at local 4.35)
          tl.fromTo("#s3-t1", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 3.85);
          tl.fromTo("#s3-t2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(3)" }, 4.05);
          tl.fromTo("#s3-t3", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 4.2);
          tl.fromTo("#s3-together", { scale: 1 }, { scale: 1.06, duration: 1.4, ease: "sine.out" }, 4.35);
          tl.to("#s3-together", { opacity: 0, y: -50, duration: 0.3, ease: "power2.in" }, 5.65);
          tl.to("#s3-label", { opacity: 0, duration: 0.3 }, 5.65);
          window.__timelines["s3-rituals"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
