<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s8-phone-template">
      <style>
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Light.woff2") format("woff2"); font-weight: 300; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Bold.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-Black.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "Abar"; src: url("../assets/fonts/AbarMid-ExtraBlack.woff2") format("woff2"); font-weight: 950; }
        #s8 {
          position: absolute;
          inset: 0;
          direction: rtl;
          font-family: "Abar", sans-serif;
          color: #f4ecdd;
        }
        #s8-top {
          position: absolute;
          top: 270px;
          left: 60px;
          right: 60px;
          height: 170px;
        }
        .s8-cap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          font-size: 42px;
          font-weight: 700;
          line-height: 1.3;
        }
        #s8-cap2 {
          color: #f4ecdd;
        }
        #s8-cap3 {
          font-family: "Abar", sans-serif;
          font-weight: 900;
          font-size: 76px;
          color: #e6c574;
        }
        #s8-stage {
          position: absolute;
          left: 0;
          right: 0;
          top: 470px;
          height: 1090px;
          perspective: 2200px;
          transform: scale(0.82);
          transform-origin: 50% 40%;
        }
        #s8-glow {
          position: absolute;
          left: 140px;
          top: 120px;
          width: 800px;
          height: 800px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(31, 181, 168, 0.4), rgba(31, 181, 168, 0) 65%);
        }
        #s8-phone {
          position: absolute;
          left: 280px;
          top: 0;
          width: 520px;
          height: 1060px;
          border-radius: 74px;
          background: #0d1626;
          border: 5px solid #3c4d66;
          box-shadow: 0 0 0 3px #1b2a40, 0 60px 120px rgba(0, 0, 0, 0.55), 0 0 60px rgba(31, 181, 168, 0.25);
          transform-style: preserve-3d;
        }
        #s8-screen {
          position: absolute;
          left: 18px;
          top: 18px;
          right: 18px;
          bottom: 18px;
          border-radius: 58px;
          overflow: hidden;
          background: #eef2f4;
        }
        #s8-notch {
          position: absolute;
          left: 50%;
          top: 18px;
          width: 150px;
          height: 38px;
          margin-left: -75px;
          border-radius: 20px;
          background: #0d1626;
          z-index: 3;
        }
        #s8-bar {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 170px;
          padding: 70px 26px 0;
          background: #0b1f3a;
          display: flex;
          align-items: center;
          gap: 18px;
          z-index: 2;
        }
        #s8-avatar {
          flex: 0 0 74px;
          width: 74px;
          height: 74px;
          border-radius: 50%;
          background: #c9a24a;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s8-bar .nm {
          display: block;
          font-size: 27px;
          font-weight: 700;
          color: #f4ecdd;
          white-space: nowrap;
        }
        #s8-bar .sub {
          display: block;
          font-size: 21px;
          font-weight: 500;
          color: #8fded6;
        }
        #s8-feed {
          position: absolute;
          left: 22px;
          right: 22px;
          top: 190px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        .s8-post {
          border-radius: 24px;
          background: #ffffff;
          overflow: hidden;
          box-shadow: 0 4px 14px rgba(11, 31, 58, 0.12);
        }
        .s8-post .img {
          height: 170px;
          background: radial-gradient(circle at 30% 30%, #1fb5a8, #0b1f3a 75%);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s8-post .img.g {
          background: radial-gradient(circle at 70% 30%, #e6c574, #7a5a1c 80%);
        }
        .s8-post .img svg {
          width: 90px;
          height: 90px;
          opacity: 0.85;
        }
        .s8-post .cap {
          display: block;
          padding: 14px 20px 16px;
          font-size: 26px;
          font-weight: 700;
          color: #0b1f3a;
        }
        #s8-join {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 150px;
          padding: 26px 30px 0;
          background: #ffffff;
          z-index: 2;
        }
        #s8-btn {
          position: relative;
          height: 82px;
          border-radius: 41px;
          background: #1fb5a8;
          overflow: hidden;
        }
        .s8-btn-t {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 32px;
          font-weight: 700;
          color: #071528;
        }
        #s8-btn-t2 {
          color: #071528;
        }
        #s8-ripple {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 60px;
          height: 60px;
          margin: -30px 0 0 -30px;
          border-radius: 50%;
          background: rgba(255, 246, 220, 0.85);
          opacity: 0;
        }
        #s8-finger {
          position: absolute;
          left: 485px;
          top: 905px;
          width: 110px;
          height: 110px;
          border-radius: 50%;
          background: rgba(244, 236, 221, 0.35);
          border: 5px solid #f4ecdd;
          opacity: 0;
        }
      </style>
      <div id="s8" data-composition-id="s8-phone" data-width="1080" data-height="1920" data-duration="5">
        <div id="s8-top">
          <div class="s8-cap" id="s8-cap1">می‌خوای از برنامه‌ها جا نمونی؟</div>
          <div class="s8-cap" id="s8-cap2">کانالمون تو ایتا منتظرته</div>
          <div class="s8-cap" id="s8-cap3">بیا، جات خالیه.</div>
        </div>
        <div id="s8-stage">
          <div id="s8-glow"></div>
          <div id="s8-phone">
            <div id="s8-screen">
              <div id="s8-bar" data-layout-allow-overlap>
                <div id="s8-avatar">
                  <svg viewBox="0 0 60 60" width="46" height="46" fill="none" stroke="#0b1f3a" stroke-width="4" aria-hidden="true">
                    <rect x="16" y="16" width="28" height="28" />
                    <rect x="16" y="16" width="28" height="28" transform="rotate(45 30 30)" />
                  </svg>
                </div>
                <div><span class="nm">مسجد شباب اهل الجنه</span><span class="sub">کانال ایتا</span></div>
              </div>
              <div id="s8-feed" data-layout-allow-overlap data-layout-allow-overflow>
                <div class="s8-post"><div class="img"><svg viewBox="0 0 60 60" fill="none" stroke="#f4ecdd" stroke-width="3"><path d="M10 56 V26 C10 16 22 8 30 4 C38 8 50 16 50 26 V56" /></svg></div><span class="cap">مراسم و مناسبت‌ها</span></div>
                <div class="s8-post"><div class="img g"><svg viewBox="0 0 60 60" fill="none" stroke="#fff6dc" stroke-width="3"><path d="M30 16 C23 10 13 10 6 13 V48 C13 45 23 45 30 51 C37 45 47 45 54 48 V13 C47 10 37 10 30 16 Z" /></svg></div><span class="cap">کلاس‌های قرآن و احکام</span></div>
                <div class="s8-post"><div class="img"><svg viewBox="0 0 60 60" fill="none" stroke="#f4ecdd" stroke-width="3"><circle cx="30" cy="30" r="22" /><path d="M30 20 L40 27 L36 39 H24 L20 27 Z" /></svg></div><span class="cap">مسابقات ورزشی</span></div>
                <div class="s8-post"><div class="img g"><svg viewBox="0 0 60 60" fill="none" stroke="#fff6dc" stroke-width="3"><path d="M30 54 C30 54 12 36 12 24 A18 18 0 0 1 48 24 C48 36 30 54 30 54 Z" /><circle cx="30" cy="24" r="6" /></svg></div><span class="cap">اردوهای زیارتی و تفریحی</span></div>
                <div class="s8-post"><div class="img"><svg viewBox="0 0 60 60" fill="none" stroke="#f4ecdd" stroke-width="3"><rect x="8" y="34" width="20" height="12" /><rect x="32" y="34" width="20" height="12" /><rect x="20" y="20" width="20" height="12" /></svg></div><span class="cap">فعالیت‌های جهادی و عمرانی</span></div>
              </div>
              <div id="s8-join" data-layout-allow-overlap>
                <div id="s8-btn">
                  <div id="s8-ripple"></div>
                  <div class="s8-btn-t" id="s8-btn-t1">پیوستن به کانال</div>
                  <div class="s8-btn-t" id="s8-btn-t2">عضو شدی؛ خوش اومدی!</div>
                </div>
              </div>
            </div>
            <div id="s8-notch"></div>
          </div>
          <div id="s8-finger"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Question first
          tl.fromTo("#s8-cap1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
          // Phone flies in from depth and settles with a 3D turn (device-surface-showcase)
          tl.fromTo("#s8-phone", { rotationY: -48, rotationX: 14, z: -900, y: 260, opacity: 0 },
            { rotationY: -14, rotationX: 6, z: 0, y: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 0.0);
          tl.fromTo("#s8-phone", { rotationY: -14, rotationX: 6 }, { rotationY: 10, rotationX: 2, duration: 3.4, ease: "sine.inOut", immediateRender: false }, 1.0);
          tl.fromTo("#s8-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "sine.out" }, 0.2);
          // Feed scrolls (channel posts)
          tl.fromTo("#s8-feed", { y: 40 }, { y: -560, duration: 2.2, ease: "power2.inOut" }, 0.6);
          // Tap on the join button (cta-morph-press) — click sfx at local 3.0
          tl.fromTo("#s8-finger", { opacity: 0, scale: 1.4, x: 60, y: 120 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.4, ease: "power2.out" }, 2.55);
          tl.to("#s8-finger", { scale: 0.8, duration: 0.08, ease: "power2.in" }, 2.95);
          tl.to("#s8-finger", { scale: 1.1, opacity: 0, duration: 0.35, ease: "power2.out" }, 3.05);
          tl.fromTo("#s8-btn", { scale: 1 }, { scale: 0.93, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 2.96);
          tl.fromTo("#s8-ripple", { opacity: 0.9, scale: 0 }, { opacity: 0, scale: 12, duration: 0.6, ease: "power2.out" }, 3.0);
          tl.set("#s8-btn", { backgroundColor: "#e6c574" }, 3.04);
          tl.fromTo("#s8-btn-t1", { opacity: 1 }, { opacity: 0, duration: 0.12 }, 3.04);
          tl.fromTo("#s8-btn-t2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 3.1);
          // Captions swap: question → invitation → payoff
          tl.to("#s8-cap1", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 2.15);
          tl.fromTo("#s8-cap2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.3);
          tl.to("#s8-cap2", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 3.45);
          tl.fromTo("#s8-cap3", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 3.55);
          // Exit — phone recedes into depth
          tl.to("#s8-phone", { z: -1200, opacity: 0, duration: 0.45, ease: "power2.in" }, 4.55);
          tl.to(["#s8-top", "#s8-glow"], { opacity: 0, duration: 0.35 }, 4.6);
          window.__timelines["s8-phone"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
