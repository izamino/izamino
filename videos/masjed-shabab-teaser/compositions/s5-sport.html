<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s5-sport-template">
      <style>
        @font-face { font-family: "Vazirmatn"; src: url("../assets/fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Vazirmatn"; src: url("../assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Vazirmatn"; src: url("../assets/fonts/Vazirmatn-Black.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "Lalezar"; src: url("../assets/fonts/Lalezar-Arabic.woff2") format("woff2"); font-weight: 400; }
        #s5 {
          position: absolute;
          inset: 0;
          direction: rtl;
          font-family: "Vazirmatn", sans-serif;
          color: #f4ecdd;
        }
        #s5-pitch {
          position: absolute;
          left: -60px;
          top: 360px;
          width: 1200px;
          height: 1300px;
          opacity: 0;
        }
        #s5-q {
          position: absolute;
          left: 0;
          right: 0;
          top: 780px;
          text-align: center;
          font-family: "Lalezar", "Vazirmatn", sans-serif;
          font-size: 230px;
          line-height: 1;
          color: #1fb5a8;
        }
        #s5-ball {
          position: absolute;
          left: 0;
          top: 0;
          width: 260px;
          height: 260px;
        }
        #s5-slam {
          position: absolute;
          left: 0;
          right: 0;
          top: 640px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #s5-slam .ln {
          display: flex;
          gap: 30px;
          justify-content: center;
        }
        #s5-slam .w {
          display: block;
          font-family: "Lalezar", "Vazirmatn", sans-serif;
          font-size: 210px;
          line-height: 1.08;
        }
        #s5-slam .w.gold {
          color: #e6c574;
        }
        #s5-pill {
          position: absolute;
          left: 0;
          right: 0;
          top: 1270px;
          display: flex;
          justify-content: center;
        }
        #s5-pill span {
          display: block;
          padding: 18px 54px;
          border-radius: 100px;
          background: #1fb5a8;
          color: #071528;
          font-size: 48px;
          font-weight: 900;
        }
        #s5-streaks i {
          position: absolute;
          display: block;
          height: 6px;
          border-radius: 3px;
          background: linear-gradient(90deg, rgba(230, 197, 116, 0), #e6c574);
        }
      </style>
      <div id="s5" data-composition-id="s5-sport" data-width="1080" data-height="1920" data-duration="5">
        <svg id="s5-pitch" viewBox="0 0 1200 1300" fill="none" stroke="#1fb5a8" stroke-width="4" aria-hidden="true">
          <rect x="120" y="60" width="960" height="1180" rx="10" />
          <path d="M120 650 H1080" />
          <circle cx="600" cy="650" r="150" />
          <circle cx="600" cy="650" r="8" fill="#1fb5a8" />
          <rect x="390" y="60" width="420" height="180" />
          <rect x="390" y="1060" width="420" height="180" />
        </svg>
        <div id="s5-streaks">
          <i style="left: 60px; top: 560px; width: 420px"></i>
          <i style="left: 180px; top: 600px; width: 300px"></i>
          <i style="left: 20px; top: 650px; width: 380px"></i>
        </div>
        <div id="s5-q">بعدش؟</div>
        <svg id="s5-ball" viewBox="0 0 260 260" aria-hidden="true">
          <circle cx="130" cy="130" r="120" fill="#f4ecdd" />
          <path d="M130 80 L178 115 L160 172 L100 172 L82 115 Z" fill="#0b1f3a" />
          <path d="M130 80 V12 M178 115 L240 92 M160 172 L200 228 M100 172 L60 228 M82 115 L20 92" stroke="#0b1f3a" stroke-width="7" fill="none" />
          <circle cx="130" cy="130" r="120" fill="none" stroke="#c9a24a" stroke-width="6" />
        </svg>
        <div id="s5-slam">
          <div class="ln"><span class="w" id="s5-w1">نوبت</span><span class="w" id="s5-w2">زمین</span></div>
          <div class="ln"><span class="w" id="s5-w3">و</span><span class="w gold" id="s5-w4">توپه!</span></div>
        </div>
        <div id="s5-pill"><span id="s5-pill-t">ورزش و مسابقات</span></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // بعدش؟ slams on the downbeat
          tl.fromTo("#s5-q", { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.0);
          tl.fromTo("#s5-q", { rotation: 0 }, { rotation: -4, duration: 0.9, ease: "sine.inOut", immediateRender: false }, 0.35);
          tl.to("#s5-q", { opacity: 0, scale: 0.7, duration: 0.2, ease: "power2.in" }, 1.15);
          // Ball whips across the frame (right → left), spinning, with motion streaks
          tl.fromTo("#s5-ball", { x: 1150, y: 520, rotation: 0, scale: 0.8 }, { x: -320, y: 470, rotation: -540, scale: 1.25, duration: 0.55, ease: "power2.in" }, 1.15);
          tl.fromTo("#s5-streaks i", { x: 900, opacity: 0 }, { x: -700, opacity: 1, duration: 0.5, ease: "power2.in", stagger: 0.04 }, 1.2);
          tl.to("#s5-streaks", { opacity: 0, duration: 0.1 }, 1.75);
          // Pitch lines appear in perspective
          tl.fromTo("#s5-pitch", { opacity: 0, scale: 1.3 }, { opacity: 0.32, scale: 1, duration: 0.6, ease: "power3.out" }, 1.4);
          tl.fromTo("#s5-pitch", { rotation: 0 }, { rotation: 6, duration: 3.4, ease: "none", immediateRender: false }, 1.4);
          // نوبت زمین و توپه! — kinetic-beat-slam, distinct entrance per word
          tl.fromTo("#s5-w1", { x: 400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 1.45);
          tl.fromTo("#s5-w2", { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 1.6);
          tl.fromTo("#s5-w3", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, 1.8);
          tl.fromTo("#s5-w4", { scale: 2.6, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 1.95);
          // Punch on the second impact (local 2.3)
          tl.fromTo("#s5-slam", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 2.3);
          tl.fromTo("#s5-pill", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 2.75);
          // Exit
          tl.to("#s5-slam", { y: -120, opacity: 0, duration: 0.3, ease: "power3.in" }, 4.62);
          tl.to(["#s5-pill", "#s5-pitch"], { opacity: 0, duration: 0.3 }, 4.62);
          window.__timelines["s5-sport"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
