<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="bg-template">
      <style>
        #bg-root {
          position: absolute;
          inset: 0;
        }
      .bg-layer {
        position: absolute;
        inset: 0;
      }
      #bg-base {
        background: radial-gradient(120% 80% at 50% 45%, #0f2a4d 0%, var(--navy) 45%, var(--deep) 100%);
      }
      #bg-glow-teal,
      #bg-glow-gold {
        position: absolute;
        width: 1400px;
        height: 1400px;
        border-radius: 50%;
      }
      #bg-glow-teal {
        left: -560px;
        top: -360px;
        background: radial-gradient(circle, rgba(31, 181, 168, 0.32) 0%, rgba(31, 181, 168, 0) 62%);
      }
      #bg-glow-gold {
        right: -600px;
        bottom: -420px;
        background: radial-gradient(circle, rgba(201, 162, 74, 0.28) 0%, rgba(201, 162, 74, 0) 62%);
      }
      #bg-pattern {
        position: absolute;
        left: -270px;
        top: -270px;
        width: 1620px;
        height: 2460px;
        opacity: 0.13;
      }
      #bg-vignette {
        background: radial-gradient(90% 60% at 50% 50%, rgba(7, 21, 40, 0) 55%, rgba(4, 12, 24, 0.85) 100%);
      }
      #bg-grain {
        opacity: 0.09;
        mix-blend-mode: overlay;
      }
      </style>
      <div id="bg-root" data-composition-id="bg" data-width="1080" data-height="1920" data-duration="45">
        <div id="bg-base" class="bg-layer"></div>
        <div id="bg-glow-teal"></div>
        <div id="bg-glow-gold"></div>
        <svg id="bg-pattern" viewBox="0 0 1620 2460" aria-hidden="true">
          <defs>
            <pattern id="girih" width="180" height="180" patternUnits="userSpaceOnUse">
              <g fill="none" stroke="#1fb5a8" stroke-width="2">
                <rect x="50" y="50" width="80" height="80" />
                <rect x="50" y="50" width="80" height="80" transform="rotate(45 90 90)" />
                <circle cx="90" cy="90" r="22" />
                <path d="M0 0 L50 50 M180 0 L130 50 M0 180 L50 130 M180 180 L130 130" />
              </g>
            </pattern>
          </defs>
          <rect width="1620" height="2460" fill="url(#girih)" />
        </svg>
        <svg id="bg-grain" class="bg-layer" width="1080" height="1920" aria-hidden="true">
          <filter id="grain-f">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1080" height="1920" filter="url(#grain-f)" />
        </svg>
        <div id="bg-vignette" class="bg-layer"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Ambient background drift (one slow pass over the whole film)
          tl.fromTo("#bg-pattern", { x: 0, y: 0, rotation: 0 }, { x: -90, y: -360, rotation: 4, duration: 45, ease: "none" }, 0);
          tl.fromTo("#bg-glow-teal", { x: 0, y: 0, scale: 1 }, { x: 260, y: 520, scale: 1.25, duration: 22, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          tl.fromTo("#bg-glow-gold", { x: 0, y: 0, scale: 1.1 }, { x: -220, y: -680, scale: 0.9, duration: 22.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
