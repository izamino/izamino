<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدار | پیش‌نمایش ۳۱ صفحه اپلیکیشن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===================== توکن‌ها ===================== */
:root{
  --ink:#070B1A; --ink2:#131A3B; --text:#16203C; --muted:#6B7695; --soft:#98A1BD;
  --line:#E7EAF3; --bg:#F4F6FB; --card:#FFFFFF;
  --brand:#5B5BF6; --brand2:#4340D8; --brand05:#EEEEFE;
  --cyan:#22D3EE; --amber:#F9A825; --green:#10B981; --pink:#F0509A; --violet:#8B5CF6; --red:#EF4444;
  --g-brand:linear-gradient(135deg,#5B5BF6,#22D3EE);
  --g-warm:linear-gradient(135deg,#F9A825,#F0509A);
  --g-night:radial-gradient(120% 120% at 80% 0%,#2A2F80,#131A3B 45%,#070B1A);
  --sh:0 1px 2px rgba(12,20,45,.05),0 10px 26px rgba(12,20,45,.07);
  --sh2:0 18px 44px rgba(12,20,45,.14);
  --r:18px; --r2:24px; --rf:999px;
  --font:"Vazirmatn","IRANSansX",Tahoma,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:#0C1124;color:var(--text);direction:rtl}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ===================== چیدمان صفحه میزبان ===================== */
.host{min-height:100vh;padding:22px 16px 60px}
.host-head{max-width:1240px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:#fff}
.host-brand{display:flex;align-items:center;gap:11px;margin-inline-end:auto}
.host-brand b{font-size:1.18rem;font-weight:900;letter-spacing:-.02em;display:block;line-height:1.3}
.host-brand small{color:#9AA4CE;font-size:.78rem}
.seg{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.08);border-radius:var(--rf)}
.seg button{padding:9px 18px;border-radius:var(--rf);font-size:.88rem;font-weight:700;color:#B9C1E6}
.seg button.on{background:var(--g-brand);color:#fff;box-shadow:0 10px 24px rgba(91,91,246,.4)}
.host-note{max-width:1240px;margin:0 auto 18px;color:#8F99C4;font-size:.85rem;line-height:1.9}

/* ===================== قاب موبایل ===================== */
.stage{display:flex;justify-content:center;padding-block:10px}
.device{
  width:390px;height:844px;padding:12px;border-radius:52px;flex:0 0 auto;
  background:linear-gradient(165deg,#333C6E,#0C1229);
  box-shadow:0 50px 90px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(255,255,255,.14);
  position:relative;
}
.device::after{content:"";position:absolute;bottom:20px;inset-inline:0;margin-inline:auto;width:126px;height:5px;border-radius:var(--rf);background:rgba(255,255,255,.5);z-index:9}
.app{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

/* نوار وضعیت */
.status{display:flex;align-items:center;justify-content:space-between;padding:14px 26px 6px;font-size:.76rem;font-weight:700;color:var(--ink);flex:0 0 auto;z-index:5}
.status.on-dark{color:#fff}
.status span{letter-spacing:.02em}

/* نوار عنوان */
.appbar{display:flex;align-items:center;gap:10px;padding:6px 18px 12px;flex:0 0 auto;z-index:4}
.appbar h1{margin:0;font-size:1.05rem;font-weight:800;flex:1;line-height:1.5}
.appbar .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);font-size:1rem}
.appbar.on-dark h1{color:#fff}
.appbar.on-dark .ic{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}

/* بدنه اسکرول */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 18px 20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.flush{padding-inline:0}
.scroll.dark{background:var(--g-night)}

/* تب‌بار */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 10px 24px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;font-size:.64rem;font-weight:700;color:var(--soft)}
.tabbar button i{font-size:1.18rem;font-style:normal;line-height:1}
.tabbar button.on{color:var(--brand2)}
.tabbar button.on i{filter:drop-shadow(0 4px 8px rgba(91,91,246,.45))}

/* ===================== اجزای رابط ===================== */
.h2{font-size:1rem;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.h2 .more{margin-inline-start:auto;font-size:.74rem;font-weight:700;color:var(--brand2)}
.muted{color:var(--muted);font-size:.82rem;line-height:1.9;margin:0}
.tiny{font-size:.72rem;color:var(--soft)}
.card{background:var(--card);border-radius:var(--r2);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 5px;font-size:.95rem;font-weight:800;line-height:1.6}
.card p{margin:0;font-size:.8rem;color:var(--muted);line-height:1.85}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stack>*+*{margin-top:12px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--rf);background:var(--brand05);color:var(--brand2);font-size:.7rem;font-weight:700;white-space:nowrap}
.chip.amber{background:#FFF4DC;color:#A96C00}
.chip.green{background:#E2FAF0;color:#067A54}
.chip.pink{background:#FEE9F2;color:#C23271}
.chip.cyan{background:#E0F8FD;color:#0B7C93}
.chip.gray{background:#F0F2F8;color:var(--muted)}
.chip.red{background:#FEECEC;color:#C02626}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{padding:8px 14px;font-size:.76rem;background:var(--card);color:var(--muted);box-shadow:var(--sh)}
.chips .chip.on{background:var(--g-brand);color:#fff;box-shadow:0 8px 18px rgba(91,91,246,.35)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:var(--rf);font-weight:800;font-size:.92rem;background:var(--g-brand);color:#fff;box-shadow:0 12px 26px rgba(91,91,246,.35)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.btn.warm{background:var(--g-warm);color:#3A1D00;box-shadow:0 12px 26px rgba(249,168,37,.35)}
.btn.sm{padding:10px 16px;width:auto;font-size:.78rem;box-shadow:none}
.btn.block+.btn{margin-top:10px}

.ico{width:44px;height:44px;flex:0 0 44px;border-radius:15px;display:grid;place-items:center;background:var(--brand05);color:var(--brand2);font-size:1.25rem}
.ico.amber{background:#FFF4DC}.ico.green{background:#E2FAF0}.ico.pink{background:#FEE9F2}
.ico.cyan{background:#E0F8FD}.ico.violet{background:#F1EBFE}.ico.gray{background:#F0F2F8}

.bar{height:8px;border-radius:var(--rf);background:#EDEFF7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--rf);background:var(--g-brand)}
.bar.warm i{background:var(--g-warm)}
.bar.dark{background:rgba(255,255,255,.18)}

.list{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li b{font-size:.87rem;font-weight:700;display:block;line-height:1.6}
.li small{font-size:.73rem;color:var(--muted);display:block;line-height:1.7}
.li .end{margin-inline-start:auto;font-size:.78rem;color:var(--soft);font-weight:700;text-align:end}

.field{margin-bottom:12px}
.field label{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.input{display:flex;align-items:center;gap:9px;padding:13px 15px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:.85rem;color:var(--ink)}
.input.ph{color:var(--soft)}
.input .end{margin-inline-start:auto;color:var(--soft);font-size:.9rem}
.toggle{width:44px;height:26px;border-radius:var(--rf);background:#DFE3EE;position:relative;flex:0 0 44px}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)}
.toggle.on::after{inset-inline-end:21px}

.hero-card{border-radius:var(--r2);padding:18px;background:var(--g-night);color:#fff;box-shadow:var(--sh2)}
.hero-card .lbl{font-size:.72rem;color:#A6B0DC}
.note{display:flex;gap:9px;padding:12px 14px;border-radius:16px;background:#EAF7F1;color:#0B6B4C;font-size:.75rem;line-height:1.85}
.note.warn{background:#FFF6E6;color:#8A5A00}
.note.info{background:var(--brand05);color:var(--brand2)}

.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin-inline:auto;
  background:conic-gradient(var(--cyan) 0 68%,rgba(255,255,255,.18) 68% 100%);position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ink2)}
.ring div{position:relative;text-align:center;line-height:1.3}
.ring b{display:block;font-size:1.5rem;font-weight:900;color:#fff}
.ring small{font-size:.68rem;color:#A6B0DC}

.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:18px;background:var(--g-brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1rem}
.avatar.lg{width:78px;height:78px;flex:0 0 78px;border-radius:26px;font-size:1.5rem}

.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.badge{background:var(--card);border-radius:18px;padding:12px 6px;box-shadow:var(--sh);font-size:.62rem;font-weight:700;color:var(--muted)}
.badge span{display:block;font-size:1.45rem;margin-bottom:4px}
.badge.off{opacity:.42;filter:grayscale(1)}

.thumb{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:2rem;color:#fff;background:var(--g-brand);position:relative;overflow:hidden}
.thumb.b{background:linear-gradient(135deg,#F9A825,#F0509A)}
.thumb.c{background:linear-gradient(135deg,#10B981,#22D3EE)}
.thumb.d{background:linear-gradient(135deg,#8B5CF6,#5B5BF6)}
.thumb .cap{position:absolute;inset-inline:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(to top,rgba(7,11,26,.9),transparent);font-size:.66rem;font-weight:700;text-align:start}
.thumb .cap small{display:block;font-weight:500;opacity:.8;font-size:.6rem}

.cover{height:150px;border-radius:var(--r2);background:var(--g-brand);display:grid;place-items:center;font-size:3rem;color:#fff;margin-bottom:14px}
.cover.night{background:var(--g-night)}

.step{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative;padding-bottom:16px}
.step::before{content:"";position:absolute;top:38px;bottom:0;inset-inline-start:17px;width:2px;background:var(--line)}
.step:last-child{padding-bottom:0}
.step:last-child::before{display:none}
.step .n{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:.82rem;background:#EDEFF7;color:var(--soft);z-index:1}
.step.done .n{background:var(--green);color:#fff}
.step.now .n{background:var(--g-brand);color:#fff;box-shadow:0 8px 18px rgba(91,91,246,.4)}
.step b{font-size:.87rem;display:block;line-height:1.6}
.step p{margin:3px 0 0;font-size:.74rem;color:var(--muted);line-height:1.8}

.bubble{max-width:78%;padding:11px 14px;border-radius:18px;font-size:.8rem;line-height:1.9;box-shadow:var(--sh)}
.bubble.me{margin-inline-start:auto;background:var(--g-brand);color:#fff;border-end-end-radius:6px}
.bubble.them{background:var(--card);border-end-start-radius:6px}
.bubble time{display:block;font-size:.62rem;opacity:.65;margin-top:4px}

.qr{width:168px;height:168px;margin:0 auto;padding:10px;background:#fff;border-radius:20px;box-shadow:var(--sh);display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr)}
.qr i{background:var(--ink);border-radius:1px}

.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots i{width:7px;height:7px;border-radius:var(--rf);background:#D5DAE8}
.dots i.on{width:20px;background:var(--brand)}

.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 28px;background:var(--g-night);color:#fff;text-align:center;position:relative;overflow:hidden}
.splash::before,.splash::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(155,231,245,.18)}
.splash::before{width:520px;height:520px;top:-190px;inset-inline-start:-160px}
.splash::after{width:680px;height:680px;bottom:-430px;inset-inline-end:-200px;border-color:rgba(91,91,246,.3)}
.splash>*{position:relative;z-index:2}
.splash h1{font-size:2.3rem;margin:0;font-weight:900;letter-spacing:-.02em}
.splash p{margin:0;color:#AEB8E4;font-size:.88rem;line-height:2}

/* ===================== گالری پیش‌نمایش ===================== */
.gallery{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:26px}
.frame{display:flex;flex-direction:column;align-items:center;gap:10px}
.frame .holder{width:254px;height:556px;position:relative}
.frame .device{position:absolute;top:0;inset-inline-start:0;transform:scale(.65);transform-origin:top right}
.frame .lbl{color:#C3CAEB;font-size:.8rem;font-weight:700;text-align:center;line-height:1.7}
.frame .lbl small{display:block;color:#7E88B4;font-weight:500;font-size:.72rem}
[dir=rtl] .frame .device{inset-inline-start:auto;inset-inline-end:0}

@media(max-width:460px){
  .device{width:340px;height:740px;border-radius:46px}
  .host{padding:14px 8px 40px}
}
</style>
</head>
<body>

<div class="host">
  <div class="host-head">
    <div class="host-brand">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="url(#lg)"/>
        <ellipse cx="24" cy="24" rx="15" ry="7.5" transform="rotate(-28 24 24)" stroke="#fff" stroke-opacity=".85" stroke-width="2"/>
        <circle cx="24" cy="24" r="5" fill="#fff"/><circle cx="37" cy="15" r="3.2" fill="#F9A825"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#5B5BF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
      </svg>
      <span><b>مدار</b><small>پروتوتایپ اپلیکیشن باشگاه رشد دانش‌آموزان</small></span>
    </div>
    <div class="seg">
      <button id="mode-app" class="on">اپ کلیک‌شدنی</button>
      <button id="mode-gallery">همه صفحه‌ها (پیش‌نمایش)</button>
    </div>
  </div>

  <p class="host-note" id="hostNote">روی کارت‌ها، تب‌ها و دکمه‌ها بزنید — همه صفحه‌ها به هم وصل‌اند. برای دیدن ۳۱ صفحه کنار هم، «همه صفحه‌ها» را انتخاب کنید.</p>

  <div class="stage" id="stage">
    <div class="device"><div class="app" id="app"></div></div>
  </div>

  <div class="gallery" id="gallery" style="display:none"></div>
</div>

<script>
/* =====================================================================
   مدار — پروتوتایپ اپ دانش‌آموزی
   ۳۱ صفحه، هم‌راستا با سند محصول: مسابقه، مهارت، مسیر رشد، پرونده رشد،
   باشگاه امتیازات، رویداد و QR، مشاوره کنترل‌شده، ایمنی نوجوان.
   ===================================================================== */

/* ---------- ابزارهای کوچک ---------- */
const go = id => `data-go="${id}"`;
const bar = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${p}%"></i></div>`;
const chips = (arr, onIdx = 0) => `<div class="chips">${arr.map((c, i) =>
  `<span class="chip ${i === onIdx ? 'on' : ''}">${c}</span>`).join('')}</div>`;
const field = (label, value, ph = false, end = '') =>
  `<div class="field"><label>${label}</label><div class="input ${ph ? 'ph' : ''}">${value}${end ? `<span class="end">${end}</span>` : ''}</div></div>`;

function qr() {
  let cells = '';
  for (let i = 0; i < 441; i++) {
    const r = Math.floor(i / 21), c = i % 21;
    const finder = (r < 7 && c < 7) || (r < 7 && c > 13) || (r > 13 && c < 7);
    const edge = finder && (r % 6 === 0 || c % 6 === 0 || (r > 1 && r < 5 && c > 1 && c < 5) || (r > 15 && r < 19 && c > 1 && c < 5) || (r > 1 && r < 5 && c > 15 && c < 19));
    const on = finder ? edge : ((r * 7 + c * 13 + (r * c) % 5) % 3 === 0);
    cells += on ? '<i></i>' : '<i style="background:transparent"></i>';
  }
  return `<div class="qr">${cells}</div>`;
}

/* ---------- داده‌های مشترک ---------- */
const TABS = [
  { id: 'home', icon: '🏠', label: 'خانه' },
  { id: 'contests', icon: '🏆', label: 'مسابقه' },
  { id: 'path', icon: '🧭', label: 'مسیر' },
  { id: 'rewards', icon: '🎁', label: 'جوایز' },
  { id: 'dossier', icon: '👤', label: 'پرونده' }
];

/* =====================================================================
   تعریف صفحه‌ها
   هر صفحه: { n: شماره, title: نام, chrome: 'full'|'bar'|'none',
   dark: bool, tab: تب فعال, bar: {back, title, action}, body: html }
   ===================================================================== */
const S = {};

/* ---------- ۱. اسپلش ---------- */
S.splash = {
  n: 1, title: 'اسپلش / خوش‌آمدگویی', chrome: 'none', dark: true,
  body: `<div class="splash">
    <svg width="96" height="96" viewBox="0 0 48 48" fill="none">
      <rect width="48" height="48" rx="14" fill="url(#lg2)"/>
      <ellipse cx="24" cy="24" rx="15" ry="7.5" transform="rotate(-28 24 24)" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>
      <circle cx="24" cy="24" r="5" fill="#fff"/><circle cx="37" cy="15" r="3.2" fill="#F9A825"/>
      <defs><linearGradient id="lg2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#5B5BF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
    </svg>
    <h1>مدار</h1>
    <p>باشگاه رشد دانش‌آموزان<br>مسابقه · مهارت · مسیر رشد · مشاوره</p>
    <div style="width:100%;margin-top:26px">
      <button class="btn" ${go('onboarding')}>ورود به باشگاه رشد</button>
      <button class="btn ghost" style="margin-top:10px" ${go('signup')}>حساب دارم، وارد می‌شوم</button>
    </div>
    <p class="tiny" style="color:#7F8AB8;margin-top:8px">فاز اول: دانش‌آموزان پسر متوسطه اول آبادان و خرمشهر</p>
  </div>`
};

/* ---------- ۲. آنبوردینگ ---------- */
S.onboarding = {
  n: 2, title: 'معرفی کوتاه / آنبوردینگ', chrome: 'bar', dark: true,
  bar: { back: 'splash', title: '', action: 'رد کردن' },
  body: `<div class="scroll dark" style="padding-top:10px">
    <div style="text-align:center;padding:14px 6px 22px">
      <div style="font-size:4rem">🚀</div>
      <h2 style="color:#fff;font-size:1.35rem;margin:10px 0 6px">هر هفته یک قدم جلوتر</h2>
      <p class="muted" style="color:#A8B2DE">مدار جای مسابقه، یادگیری مهارت و ساختن پرونده رشد توست.</p>
    </div>

const ORDER = ['splash', 'onboarding', 'signup', 'verify', 'interests', 'home', 'rewards', 'level',
  'contests', 'contest', 'missions', 'result', 'academy', 'course', 'path', 'dossier', 'assessment',
  'exhibit', 'submitwork', 'teams', 'team', 'events', 'event', 'ticket', 'counseling', 'ticket-new',
  'chat', 'notifications', 'invites', 'profile', 'settings'];

function statusBar(dark) {
  return `<div class="status ${dark ? 'on-dark' : ''}">
    <span>۹:۴۱</span><span>▁▃▅ &nbsp;◔ &nbsp;█</span></div>`;
}

function appBar(s) {
  if (!s.bar) return '';
  if (s.bar.custom) return `<div class="appbar ${s.dark ? 'on-dark' : ''}">${s.bar.custom}</div>`;
  const back = s.bar.back ? `<button class="ic" ${go(s.bar.back)}>→</button>` : '<span style="width:38px"></span>';
  const action = s.bar.action ? `<button class="ic">${s.bar.action}</button>` : '<span style="width:38px"></span>';
  return `<div class="appbar ${s.dark ? 'on-dark' : ''}">${back}<h1 style="text-align:center">${s.bar.title || ''}</h1>${action}</div>`;
}

function tabBar(active) {
  return `<div class="tabbar">${TABS.map(t =>
    `<button class="${t.id === active ? 'on' : ''}" data-go="${t.id}"><i>${t.icon}</i>${t.label}</button>`).join('')}</div>`;
}

function renderScreen(id) {
  const s = S[id];
  if (!s) return '';
  return statusBar(s.dark) + appBar(s) + s.body + (s.chrome === 'full' ? tabBar(s.tab) : '');
}

/* ---------- حالت اپ ---------- */
let current = 'home';
const appEl = document.getElementById('app');

function show(id) {
  if (!S[id]) return;
  current = id;
  appEl.innerHTML = renderScreen(id);
  const sc = appEl.querySelector('.scroll');
  if (sc) sc.scrollTop = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (!t) return;
  const id = t.getAttribute('data-go');
  if (S[id]) show(id);
});

/* ---------- حالت گالری ---------- */
function buildGallery() {
  const g = document.getElementById('gallery');
  if (g.dataset.built) return;
  g.innerHTML = ORDER.map(id => {
    const s = S[id];
    return `<div class="frame">
      <div class="holder"><div class="device"><div class="app">${renderScreen(id)}</div></div></div>
      <span class="lbl">صفحه ${s.n} — ${s.title}<small>${id}</small></span>
    </div>`;
  }).join('');
  g.dataset.built = '1';
}

const btnApp = document.getElementById('mode-app');
const btnGal = document.getElementById('mode-gallery');
const stage = document.getElementById('stage');
const gal = document.getElementById('gallery');
const note = document.getElementById('hostNote');

btnApp.addEventListener('click', () => {
  btnApp.classList.add('on'); btnGal.classList.remove('on');
  stage.style.display = 'flex'; gal.style.display = 'none';
  note.textContent = 'روی کارت‌ها، تب‌ها و دکمه‌ها بزنید — همه صفحه‌ها به هم وصل‌اند. برای دیدن ۳۱ صفحه کنار هم، «همه صفحه‌ها» را انتخاب کنید.';
});

btnGal.addEventListener('click', () => {
  btnGal.classList.add('on'); btnApp.classList.remove('on');
  buildGallery();
  stage.style.display = 'none'; gal.style.display = 'grid';
  note.textContent = 'پیش‌نمایش کامل: ۳۱ صفحه اپ مدار به ترتیب سناریوی محصول — از اسپلش و ثبت‌نام تا پرونده رشد، مشاوره و تنظیمات حریم خصوصی.';
});

show('home');
btnGal.click();
