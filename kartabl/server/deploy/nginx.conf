# /etc/nginx/sites-available/kartabl  (نمونه؛ نام دامنه را عوض کنید)
server {
    listen 80;
    server_name kartabl.example.ir;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name kartabl.example.ir;
    ssl_certificate     /etc/letsencrypt/live/kartabl.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kartabl.example.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;

    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
